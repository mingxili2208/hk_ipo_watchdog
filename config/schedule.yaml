schedule:
  ipo_calendar:
    enabled: true
    interval_minutes: 10

  hkex_announcements:
    enabled: true
    interval_minutes: 5

  allotment_results:
    # Allotment results are collected by the HKEX announcements job.
    enabled: false
    interval_minutes: 5

  grey_market:
    # 暗盘采集：使用 Playwright 渲染 AAStocks 动态页面
    enabled: true
    interval_minutes: 5
    timezone: "Asia/Hong_Kong"
    window_start: "16:15"
    window_end: "18:30"
    weekdays_only: true

  llm_evaluation:
    # 日报前刷新活跃 IPO 的申购期 AI 评估
    enabled: true
    time: "20:30"
    timezone: "Asia/Hong_Kong"

  daily_digest:
    enabled: true
    time: "21:30"
    timezone: "Asia/Hong_Kong"
