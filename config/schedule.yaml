schedule:
  ipo_calendar:
    enabled: true
    interval_minutes: 10

  hkex_announcements:
    enabled: true
    interval_minutes: 5

  allotment_results:
    # Allotment results are collected by the HKEX announcements job.
    enabled: false
    interval_minutes: 5

  grey_market:
    # Disabled: AAStocks HTML contains quote placeholders; live values need dynamic retrieval.
    enabled: false
    interval_minutes: 5
    timezone: "Asia/Hong_Kong"
    window_start: "16:15"
    window_end: "18:30"
    weekdays_only: true

  daily_digest:
    enabled: true
    time: "21:30"
    timezone: "Asia/Hong_Kong"
