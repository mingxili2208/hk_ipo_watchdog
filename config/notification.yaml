notification:
  quiet_hours:
    enabled: false
    start: "23:30"
    end: "08:00"

  telegram:
    enabled: false
    bot_token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID
    min_level: 2

  email:
    enabled: true
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    encryption: "starttls"
    username_env: SMTP_USERNAME
    password_env: SMTP_PASSWORD
    min_level: 2

  bark:
    enabled: false
    device_key_env: BARK_DEVICE_KEY
    min_level: 3

  server_chan:
    enabled: false
    send_key_env: SERVER_CHAN_SEND_KEY
    min_level: 3
