llm:
  # Choose exactly one runtime profile here.
  active_profile: glm
  temperature: 0.2
  max_tokens: 1200
  timeout_seconds: 30
  retry_times: 1

  profiles:
    mock:
      provider: mock

    glm:
      provider: openai
      model: glm-5.1
      api_key_env: ZHIPU_API_KEY
      base_url: "https://open.bigmodel.cn/api/paas/v4/"
      thinking: disabled

    openai:
      provider: openai
      model: gpt-4.1-mini
      api_key_env: OPENAI_API_KEY
      base_url: null

    deepseek:
      provider: openai
      model: deepseek-chat
      api_key_env: DEEPSEEK_API_KEY
      base_url: "https://api.deepseek.com"
